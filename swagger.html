<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Swagger — TaskFlow API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #fafafa;
        }
        
        .topbar {
            background: #1a1a2e;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #4f46e5;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .topbar .logo {
            font-size: 22px;
            font-weight: 700;
            color: white;
        }
        
        .topbar .logo span {
            color: #4f46e5;
        }
        
        .topbar .version {
            background: #4f46e5;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .topbar .badge {
            background: #10b981;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .topbar .badge.lock {
            background: #f59e0b;
        }
        
        .topbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .topbar .right a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
            padding: 6px 14px;
            border-radius: 8px;
        }
        
        .topbar .right a:hover {
            color: white;
            background: rgba(255,255,255,0.1);
        }
        
        .topbar .right .btn-primary {
            color: #4f46e5;
            background: white;
            border: 1px solid #4f46e5;
        }
        
        .topbar .right .btn-primary:hover {
            background: #4f46e5;
            color: white;
        }
        
        .status-bar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 32px;
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: #64748b;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .status-bar .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-bar .item strong {
            color: #1a1a2e;
        }
        
        .status-bar .item .count {
            background: #e2e8f0;
            padding: 0 10px;
            border-radius: 12px;
            font-weight: 600;
            color: #1a1a2e;
        }
        
        .status-bar .server-url {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #1a1a2e;
            margin-left: auto;
        }
        
        #swagger-ui {
            padding: 0 20px;
        }
        
        @media (max-width: 768px) {
            .topbar {
                padding: 12px 16px;
            }
            .topbar .logo {
                font-size: 18px;
            }
            .status-bar {
                padding: 8px 16px;
                font-size: 12px;
                gap: 12px;
            }
            #swagger-ui {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="left" style="display:flex; align-items:center; gap:16px;">
            <div class="logo">📋 Task<span>Flow</span></div>
            <span class="version">API v1.0</span>
            <span class="badge">✅ Live</span>
            <span class="badge lock">🔒 Auth Required</span>
        </div>
        <div class="right">
            <a href="index.html" target="_blank">🚀 Открыть приложение</a>
            <a href="#" class="btn-primary" id="refreshBtn">🔄 Обновить</a>
            <a href="#" class="btn-primary" id="downloadBtn">📥 Скачать JSON</a>
        </div>
    </div>

    <div class="status-bar">
        <div class="item">📊 <strong>Всего эндпоинтов:</strong> <span class="count" id="totalEndpoints">0</span></div>
        <div class="item">📝 <strong>Методы:</strong> GET <span class="count" id="getCount">0</span> POST <span class="count" id="postCount">0</span> PUT <span class="count" id="putCount">0</span> DELETE <span class="count" id="deleteCount">0</span></div>
        <div class="server-url" id="serverUrl">🌐 http://localhost:3000</div>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000';
        document.getElementById('serverUrl').textContent = '🌐 ' + API_BASE;

        function generateOpenAPISpec() {
            return {
                openapi: '3.0.0',
                info: {
                    title: 'TaskFlow API',
                    description: 'API для управления пользователями и профилями',
                    version: '1.0.0',
                    contact: {
                        name: 'TaskFlow Support',
                        email: 'support@taskflow.com'
                    }
                },
                servers: [
                    {
                        url: API_BASE,
                        description: 'Локальный сервер'
                    }
                ],
                tags: [
                    { name: 'auth', description: 'Авторизация' },
                    { name: 'profiles', description: 'Профили' },
                    { name: 'dashboard', description: 'Статистика' }
                ],
                components: {
                    securitySchemes: {
                        sessionAuth: {
                            type: 'apiKey',
                            in: 'header',
                            name: 'X-User-Email',
                            description: 'Email пользователя для авторизации'
                        }
                    },
                    schemas: {
                        User: {
                            type: 'object',
                            properties: {
                                email: {
                                    type: 'string',
                                    format: 'email',
                                    example: 'user@example.com',
                                    description: 'Email (6-50 символов)',
                                    minLength: 6,
                                    maxLength: 50
                                },
                                name: {
                                    type: 'string',
                                    example: 'Иван Иванов',
                                    description: 'Имя пользователя'
                                },
                                password: {
                                    type: 'string',
                                    format: 'password',
                                    example: 'password123',
                                    description: 'Пароль (6-50 символов)',
                                    minLength: 6,
                                    maxLength: 50
                                }
                            },
                            required: ['email', 'password']
                        },
                        Profile: {
                            type: 'object',
                            properties: {
                                id: {
                                    type: 'integer',
                                    example: 1,
                                    description: 'Уникальный идентификатор'
                                },
                                name: {
                                    type: 'string',
                                    example: 'Иван Иванов',
                                    description: 'Имя'
                                },
                                email: {
                                    type: 'string',
                                    format: 'email',
                                    example: 'ivan@example.com',
                                    description: 'Email'
                                },
                                phone: {
                                    type: 'string',
                                    example: '+7 999 123-45-67',
                                    description: 'Телефон'
                                },
                                website: {
                                    type: 'string',
                                    example: 'example.com',
                                    description: 'Сайт'
                                },
                                createdBy: {
                                    type: 'string',
                                    example: 'user@example.com',
                                    description: 'Кто создал'
                                },
                                createdAt: {
                                    type: 'string',
                                    format: 'date-time',
                                    example: '2024-01-15T10:30:00Z',
                                    description: 'Дата создания'
                                }
                            },
                            required: ['name', 'email']
                        },
                        Error: {
                            type: 'object',
                            properties: {
                                error: {
                                    type: 'string',
                                    example: 'Требуется авторизация'
                                }
                            }
                        }
                    }
                },
                paths: {
                    '/users': {
                        post: {
                            tags: ['auth'],
                            summary: 'Регистрация пользователя',
                            description: 'Создаёт нового пользователя. Email и пароль должны быть от 6 до 50 символов.',
                            requestBody: {
                                required: true,
                                content: {
                                    'application/json': {
                                        schema: {
                                            $ref: '#/components/schemas/User'
                                        },
                                        example: {
                                            email: 'newuser@example.com',
                                            name: 'Новый Пользователь',
                                            password: 'password123'
                                        }
                                    }
                                }
                            },
                            responses: {
                                '201': {
                                    description: 'Пользователь создан',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/User'
                                            },
                                            example: {
                                                email: 'newuser@example.com',
                                                name: 'Новый Пользователь'
                                            }
                                        }
                                    }
                                },
                                '400': {
                                    description: 'Ошибка валидации',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Error'
                                            }
                                        }
                                    }
                                },
                                '409': {
                                    description: 'Пользователь уже существует',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Error'
                                            },
                                            example: {
                                                error: 'Пользователь уже существует'
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    },
                    '/users/login': {
                        post: {
                            tags: ['auth'],
                            summary: 'Вход в систему',
                            description: 'Аутентификация пользователя.',
                            requestBody: {
                                required: true,
                                content: {
                                    'application/json': {
                                        schema: {
                                            type: 'object',
                                            properties: {
                                                email: {
                                                    type: 'string',
                                                    format: 'email',
                                                    example: 'user@example.com'
                                                },
                                                password: {
                                                    type: 'string',
                                                    format: 'password',
                                                    example: 'password123'
                                                }
                                            },
                                            required: ['email', 'password']
                                        },
                                        example: {
                                            email: 'user@example.com',
                                            password: 'password123'
                                        }
                                    }
                                }
                            },
                            responses: {
                                '200': {
                                    description: 'Успешный вход',
                                    content: {
                                        'application/json': {
                                            example: {
                                                user: {
                                                    email: 'user@example.com',
                                                    name: 'Тестовый Пользователь'
                                                },
                                                session: 'saved'
                                            }
                                        }
                                    }
                                },
                                '401': {
                                    description: 'Неверный логин или пароль',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Error'
                                            },
                                            example: {
                                                error: 'Неверный логин или пароль'
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    },
                    '/users/logout': {
                        post: {
                            tags: ['auth'],
                            summary: 'Выход из системы',
                            description: 'Очищает сессию пользователя.',
                            responses: {
                                '200': {
                                    description: 'Выход выполнен',
                                    content: {
                                        'application/json': {
                                            example: {
                                                message: 'Выход выполнен'
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    },
                    '/users/profile': {
                        get: {
                            tags: ['auth'],
                            summary: 'Получить профиль текущего пользователя',
                            description: 'Возвращает данные текущего пользователя.',
                            security: [{ sessionAuth: [] }],
                            responses: {
                                '200': {
                                    description: 'Данные пользователя',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/User'
                                            },
                                            example: {
                                                email: 'user@example.com',
                                                name: 'Тестовый Пользователь'
                                            }
                                        }
                                    }
                                },
                                '401': {
                                    description: 'Не авторизован'
                                }
                            }
                        },
                        put: {
                            tags: ['auth'],
                            summary: 'Обновить профиль пользователя',
                            description: 'Обновляет данные текущего пользователя.',
                            security: [{ sessionAuth: [] }],
                            requestBody: {
                                required: true,
                                content: {
                                    'application/json': {
                                        schema: {
                                            type: 'object',
                                            properties: {
                                                name: {
                                                    type: 'string',
                                                    example: 'Новое Имя'
                                                },
                                                email: {
                                                    type: 'string',
                                                    format: 'email',
                                                    example: 'newemail@example.com'
                                                },
                                                password: {
                                                    type: 'string',
                                                    format: 'password',
                                                    example: 'newpassword123',
                                                    description: 'Оставьте пустым, чтобы не менять'
                                                }
                                            }
                                        },
                                        example: {
                                            name: 'Новое Имя',
                                            email: 'newemail@example.com',
                                            password: 'newpassword123'
                                        }
                                    }
                                }
                            },
                            responses: {
                                '200': {
                                    description: 'Профиль обновлён',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/User'
                                            }
                                        }
                                    }
                                },
                                '400': {
                                    description: 'Ошибка валидации'
                                },
                                '409': {
                                    description: 'Email уже занят'
                                }
                            }
                        }
                    },
                    '/profiles': {
                        get: {
                            tags: ['profiles'],
                            summary: 'Получить все профили',
                            description: 'Возвращает список всех профилей текущего пользователя.',
                            security: [{ sessionAuth: [] }],
                            responses: {
                                '200': {
                                    description: 'Список профилей',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                type: 'array',
                                                items: {
                                                    $ref: '#/components/schemas/Profile'
                                                }
                                            },
                                            example: [
                                                {
                                                    id: 1,
                                                    name: 'Иван Иванов',
                                                    email: 'ivan@example.com',
                                                    phone: '+7 999 123-45-67',
                                                    website: 'example.com',
                                                    createdBy: 'user@example.com',
                                                    createdAt: '2024-01-15T10:30:00Z'
                                                }
                                            ]
                                        }
                                    }
                                },
                                '401': {
                                    description: 'Не авторизован'
                                }
                            }
                        },
                        post: {
                            tags: ['profiles'],
                            summary: 'Создать профиль',
                            description: 'Создаёт новый профиль для текущего пользователя.',
                            security: [{ sessionAuth: [] }],
                            requestBody: {
                                required: true,
                                content: {
                                    'application/json': {
                                        schema: {
                                            type: 'object',
                                            properties: {
                                                name: {
                                                    type: 'string',
                                                    example: 'Иван Иванов'
                                                },
                                                email: {
                                                    type: 'string',
                                                    format: 'email',
                                                    example: 'ivan@example.com'
                                                },
                                                phone: {
                                                    type: 'string',
                                                    example: '+7 999 123-45-67'
                                                },
                                                website: {
                                                    type: 'string',
                                                    example: 'example.com'
                                                }
                                            },
                                            required: ['name', 'email']
                                        },
                                        example: {
                                            name: 'Иван Иванов',
                                            email: 'ivan@example.com',
                                            phone: '+7 999 123-45-67',
                                            website: 'example.com'
                                        }
                                    }
                                }
                            },
                            responses: {
                                '201': {
                                    description: 'Профиль создан',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Profile'
                                            },
                                            example: {
                                                id: 1,
                                                name: 'Иван Иванов',
                                                email: 'ivan@example.com',
                                                phone: '+7 999 123-45-67',
                                                website: 'example.com',
                                                createdBy: 'user@example.com',
                                                createdAt: '2024-01-15T10:30:00Z'
                                            }
                                        }
                                    }
                                },
                                '400': {
                                    description: 'Ошибка валидации'
                                },
                                '401': {
                                    description: 'Не авторизован'
                                }
                            }
                        }
                    },
                    '/profiles/{id}': {
                        get: {
                            tags: ['profiles'],
                            summary: 'Получить профиль по ID',
                            description: 'Возвращает конкретный профиль.',
                            security: [{ sessionAuth: [] }],
                            parameters: [
                                {
                                    in: 'path',
                                    name: 'id',
                                    schema: { type: 'integer' },
                                    required: true,
                                    example: 1,
                                    description: 'ID профиля'
                                }
                            ],
                            responses: {
                                '200': {
                                    description: 'Профиль найден',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Profile'
                                            },
                                            example: {
                                                id: 1,
                                                name: 'Иван Иванов',
                                                email: 'ivan@example.com',
                                                phone: '+7 999 123-45-67',
                                                website: 'example.com'
                                            }
                                        }
                                    }
                                },
                                '404': {
                                    description: 'Профиль не найден'
                                }
                            }
                        },
                        put: {
                            tags: ['profiles'],
                            summary: 'Обновить профиль по ID',
                            description: 'Обновляет существующий профиль.',
                            security: [{ sessionAuth: [] }],
                            parameters: [
                                {
                                    in: 'path',
                                    name: 'id',
                                    schema: { type: 'integer' },
                                    required: true,
                                    example: 1,
                                    description: 'ID профиля'
                                }
                            ],
                            requestBody: {
                                required: true,
                                content: {
                                    'application/json': {
                                        schema: {
                                            $ref: '#/components/schemas/Profile'
                                        },
                                        example: {
                                            name: 'Обновлённое Имя',
                                            email: 'updated@example.com',
                                            phone: '+7 999 111-22-33',
                                            website: 'updated-site.com'
                                        }
                                    }
                                }
                            },
                            responses: {
                                '200': {
                                    description: 'Профиль обновлён',
                                    content: {
                                        'application/json': {
                                            schema: {
                                                $ref: '#/components/schemas/Profile'
                                            }
                                        }
                                    }
                                },
                                '404': {
                                    description: 'Профиль не найден'
                                }
                            }
                        },
                        delete: {
                            tags: ['profiles'],
                            summary: 'Удалить профиль по ID',
                            description: 'Удаляет существующий профиль.',
                            security: [{ sessionAuth: [] }],
                            parameters: [
                                {
                                    in: 'path',
                                    name: 'id',
                                    schema: { type: 'integer' },
                                    required: true,
                                    example: 1,
                                    description: 'ID профиля'
                                }
                            ],
                            responses: {
                                '204': {
                                    description: 'Профиль удалён'
                                },
                                '404': {
                                    description: 'Профиль не найден'
                                }
                            }
                        }
                    },
                    '/dashboard': {
                        get: {
                            tags: ['dashboard'],
                            summary: 'Получить статистику',
                            description: 'Возвращает статистику по профилям пользователя.',
                            security: [{ sessionAuth: [] }],
                            responses: {
                                '200': {
                                    description: 'Статистика',
                                    content: {
                                        'application/json': {
                                            example: {
                                                totalProfiles: 3,
                                                totalUsers: 2,
                                                lastProfiles: [
                                                    {
                                                        id: 1,
                                                        name: 'Иван Иванов',
                                                        email: 'ivan@example.com'
                                                    }
                                                ]
                                            }
                                        }
                                    }
                                },
                                '401': {
                                    description: 'Не авторизован'
                                }
                            }
                        }
                    }
                }
            };
        }

        function updateStats(spec) {
            const paths = spec.paths || {};
            let total = 0,
                get = 0,
                post = 0,
                put = 0,
                del = 0;

            Object.values(paths).forEach(path => {
                Object.keys(path).forEach(method => {
                    total++;
                    if (method === 'get') get++;
                    if (method === 'post') post++;
                    if (method === 'put') put++;
                    if (method === 'delete') del++;
                });
            });

            document.getElementById('totalEndpoints').textContent = total;
            document.getElementById('getCount').textContent = get;
            document.getElementById('postCount').textContent = post;
            document.getElementById('putCount').textContent = put;
            document.getElementById('deleteCount').textContent = del;
        }

        function initSwagger() {
            const spec = generateOpenAPISpec();
            updateStats(spec);

            const ui = SwaggerUIBundle({
                spec: spec,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: 'StandaloneLayout'
            });

            window.ui = ui;
        }

        document.getElementById('refreshBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('swagger-ui').innerHTML = '';
            initSwagger();
        });

        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const spec = generateOpenAPISpec();
            const json = JSON.stringify(spec, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'swagger.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        document.addEventListener('DOMContentLoaded', function() {
            initSwagger();
            console.log('📚 Swagger API Documentation loaded');
        });
    </script>

</body>
</html>
